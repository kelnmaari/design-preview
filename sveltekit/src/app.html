<!doctype html>
<html lang="en" class="ember">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
		<script>
			// Apply persisted Ember theme before first paint (no dark-mode flash).
			try {
				var t = localStorage.getItem('ember-theme') || 'dark';
				document.documentElement.classList.toggle('ember-light', t === 'light');
				document.documentElement.classList.toggle('ember', t !== 'light');
				document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="ember-atmo">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
